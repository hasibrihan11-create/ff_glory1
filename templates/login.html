<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Fire Glory - Login / Signup</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0a0f1c;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
        }

        :root {
            --primary: #22d3ee;
            --primary-dark: #06b6d4;
            --accent: #a855f7;
            --bg-card: #1a2338;
            --border: #334155;
            --text: #e2e8f0;
            --text-dim: #94a3b8;
        }

        .bg-effect {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: 
                radial-gradient(circle at 20% 30%, rgba(34, 211, 238, 0.12) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(168, 85, 247, 0.10) 0%, transparent 50%);
            animation: bgPulse 12s ease-in-out infinite;
        }

        @keyframes bgPulse {
            0%, 100% { opacity: 0.85; }
            50% { opacity: 1; }
        }

        .auth-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 32px;
            width: 100%;
            max-width: 460px;
            padding: 2.8rem 2.5rem;
            box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.6),
                        0 0 0 1px rgba(34, 211, 238, 0.15) inset;
            animation: fadeIn 0.6s ease;
            position: relative;
            overflow: hidden;
        }

        .auth-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(34, 211, 238, 0.08) 0%, transparent 70%);
            animation: glowRotate 25s linear infinite;
            z-index: -1;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes glowRotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .logo {
            text-align: center;
            margin-bottom: 2.2rem;
        }

        .logo h1 {
            font-size: 2.1rem;
            font-weight: 800;
            background: linear-gradient(135deg, #22d3ee, #a855f7, #67e8f9);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .logo p {
            color: var(--text-dim);
            font-size: 0.9rem;
            margin-top: 0.4rem;
            letter-spacing: 0.5px;
        }

        .tabs {
            display: flex;
            gap: 1rem;
            margin-bottom: 2.2rem;
            border-bottom: 1px solid var(--border);
        }

        .tab {
            flex: 1;
            text-align: center;
            padding: 0.9rem;
            background: none;
            border: none;
            font-size: 1.02rem;
            font-weight: 600;
            color: var(--text-dim);
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .tab.active {
            color: white;
        }

        .tab.active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(to right, var(--primary), var(--accent));
            border-radius: 3px;
        }

        .form {
            display: none;
            animation: fadeIn 0.4s ease;
        }

        .form.active {
            display: block;
        }

        .input-group {
            margin-bottom: 1.3rem;
        }

        .input-group input {
            width: 100%;
            padding: 1rem 1.1rem;
            background: #0f172a;
            border: 1.5px solid var(--border);
            border-radius: 16px;
            font-size: 1rem;
            color: white;
            font-family: inherit;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(34, 211, 238, 0.15);
        }

        .input-group input::placeholder {
            color: #64748b;
        }

        .checkbox-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.6rem;
            font-size: 0.88rem;
        }

        .checkbox {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            color: var(--text-dim);
        }

        .checkbox input {
            accent-color: var(--primary);
        }

        .forgot {
            color: var(--primary);
            text-decoration: none;
        }

        .forgot:hover {
            text-decoration: underline;
        }

        .btn {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border: none;
            border-radius: 16px;
            font-size: 1.05rem;
            font-weight: 700;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 1.6rem;
            box-shadow: 0 8px 20px rgba(34, 211, 238, 0.3);
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(168, 85, 247, 0.4);
        }

        .divider {
            text-align: center;
            position: relative;
            margin: 1.6rem 0;
        }

        .divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: var(--border);
        }

        .divider span {
            background: var(--bg-card);
            padding: 0 1.2rem;
            position: relative;
            font-size: 0.85rem;
            color: var(--text-dim);
        }

        .social {
            display: flex;
            justify-content: center;
            gap: 1.2rem;
        }

        .social a {
            width: 48px;
            height: 48px;
            background: #0f172a;
            border: 1.5px solid var(--border);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-dim);
            text-decoration: none;
            transition: all 0.3s ease;
            font-size: 1.3rem;
        }

        .social a:hover {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: white;
            transform: scale(1.1) translateY(-3px);
        }

        .alert {
            padding: 0.9rem;
            border-radius: 14px;
            margin-bottom: 1.2rem;
            font-size: 0.9rem;
            display: none;
        }

        .alert.error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #f87171;
            display: block;
        }

        .alert.success {
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid rgba(34, 197, 94, 0.4);
            color: #4ade80;
            display: block;
        }

        .terms-text {
            font-size: 0.78rem;
            color: var(--text-dim);
            text-align: center;
            margin-top: 1.6rem;
        }

        .terms-text a {
            color: var(--primary);
            text-decoration: none;
        }

        @media (max-width: 500px) {
            .auth-card {
                padding: 2rem 1.8rem;
            }
            .logo h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>

<div class="bg-effect"></div>

<div class="auth-card">
    <div class="logo">
        <h1>>🔥 Free Fire Glory</h1>
        <p>Free Fire Clan Glory Automation</p>
    </div>

    <div class="tabs">
        <button class="tab active" data-form="login">Login</button>
        <button class="tab" data-form="signup">Sign Up</button>
    </div>

    <div class="form active" id="loginForm">
        <div class="alert" id="loginAlert"></div>
        <form id="login">
            <div class="input-group">
                <input type="email" id="loginEmail" placeholder="Email address" required>
            </div>
            <div class="input-group">
                <input type="password" id="loginPassword" placeholder="Password" required>
            </div>
            <div class="checkbox-group">
                <label class="checkbox">
                    <input type="checkbox"> Remember me
                </label>
                <a href="#" class="forgot">Forgot password?</a>
            </div>
            <button type="submit" class="btn">Login</button>
        </form>
        <div class="divider"><span>Or continue with</span></div>
        <div class="social">
            <a href="#"><i class="fab fa-google"></i></a>
            <a href="#"><i class="fab fa-discord"></i></a>
            <a href="#"><i class="fab fa-github"></i></a>
        </div>
    </div>

    <div class="form" id="signupForm">
        <div class="alert" id="signupAlert"></div>
        <form id="signup">
            <div class="input-group">
                <input type="text" id="signupName" placeholder="Full name" required>
            </div>
            <div class="input-group">
                <input type="email" id="signupEmail" placeholder="Email address" required>
            </div>
            <div class="input-group">
                <input type="password" id="signupPassword" placeholder="Password (min 6 characters)" required>
            </div>
            <div class="input-group">
                <input type="password" id="signupConfirm" placeholder="Confirm password" required>
            </div>
            <div class="checkbox-group">
                <label class="checkbox">
                    <input type="checkbox" id="termsCheck"> I agree to the Terms
                </label>
            </div>
            <button type="submit" class="btn">Create Account</button>
        </form>
        <div class="divider"><span>Or sign up with</span></div>
        <div class="social">
            <a href="#"><i class="fab fa-google"></i></a>
            <a href="#"><i class="fab fa-discord"></i></a>
            <a href="#"><i class="fab fa-github"></i></a>
        </div>
    </div>

    <div class="terms-text">
        By continuing, you agree to our <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>
    </div>
</div>

<script>
    // Tab switching
    const tabs = document.querySelectorAll('.tab');
    const forms = document.querySelectorAll('.form');

    tabs.forEach(tab => {
        tab.addEventListener('click', () => {
            const formId = tab.dataset.form;
            tabs.forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
            forms.forEach(form => form.classList.remove('active'));
            document.getElementById(formId + 'Form').classList.add('active');
        });
    });

    // Login handler
    document.getElementById('login').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('loginEmail').value;
        const password = document.getElementById('loginPassword').value;
        const alertBox = document.getElementById('loginAlert');

        if (!email || !password) {
            alertBox.textContent = 'Please fill in all fields';
            alertBox.className = 'alert error';
            setTimeout(() => alertBox.className = 'alert', 3000);
            return;
        }

        try {
            const res = await fetch('app/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });
            
            const data = await res.json();
            
            if (res.ok && data.success) {
                alertBox.textContent = 'Login successful! Redirecting...';
                alertBox.className = 'alert success';
                setTimeout(() => {
                    window.location.href = 'app/home';
                }, 1500);
            } else {
                alertBox.textContent = data.error || 'Login failed';
                alertBox.className = 'alert error';
                setTimeout(() => alertBox.className = 'alert', 3000);
            }
        } catch (err) {
            alertBox.textContent = 'Network error. Please try again.';
            alertBox.className = 'alert error';
            setTimeout(() => alertBox.className = 'alert', 3000);
        }
    });

    // Signup handler
    document.getElementById('signup').addEventListener('submit', async (e) => {
        e.preventDefault();
        const name = document.getElementById('signupName').value;
        const email = document.getElementById('signupEmail').value;
        const password = document.getElementById('signupPassword').value;
        const confirm = document.getElementById('signupConfirm').value;
        const terms = document.getElementById('termsCheck').checked;
        const alertBox = document.getElementById('signupAlert');

        if (!name || !email || !password || !confirm) {
            alertBox.textContent = 'Please fill in all fields';
            alertBox.className = 'alert error';
            setTimeout(() => alertBox.className = 'alert', 3000);
            return;
        }

        if (password !== confirm) {
            alertBox.textContent = 'Passwords do not match';
            alertBox.className = 'alert error';
            setTimeout(() => alertBox.className = 'alert', 3000);
            return;
        }

        if (password.length < 6) {
            alertBox.textContent = 'Password must be at least 6 characters';
            alertBox.className = 'alert error';
            setTimeout(() => alertBox.className = 'alert', 3000);
            return;
        }

        if (!terms) {
            alertBox.textContent = 'Please agree to the Terms of Service';
            alertBox.className = 'alert error';
            setTimeout(() => alertBox.className = 'alert', 3000);
            return;
        }

        try {
            const res = await fetch('app/api/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: name, email, password })
            });
            
            const data = await res.json();
            
            if (res.ok && data.success) {
                alertBox.textContent = 'Account created! Redirecting to login...';
                alertBox.className = 'alert success';
                setTimeout(() => {
                    document.getElementById('loginEmail').value = email;
                    document.querySelector('.tab[data-form="login"]').click();
                    alertBox.className = 'alert';
                }, 2000);
            } else {
                alertBox.textContent = data.error || 'Registration failed';
                alertBox.className = 'alert error';
                setTimeout(() => alertBox.className = 'alert', 3000);
            }
        } catch (err) {
            alertBox.textContent = 'Network error. Please try again.';
            alertBox.className = 'alert error';
            setTimeout(() => alertBox.className = 'alert', 3000);
        }
    });
</script>
</body>
</html>
